<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser</title>
  <script src="https://cdn.jsdelivr.net/npm/x-frame-bypass@1"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f0f0;
      overflow: hidden;
    }

    #gatekeeper-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
    }

    #gatekeeper-overlay.hidden {
      display: none;
    }

    #browser-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #browser-container.unlocked {
      opacity: 1;
      pointer-events: auto;
    }

    #tab-row {
      display: flex;
      gap: 4px;
      padding: 8px;
      background: #e8e8e8;
      border-bottom: 1px solid #ccc;
      overflow-x: auto;
      align-items: center;
    }

    .tab-button {
      padding: 8px 12px;
      background: #d0d0d0;
      border: 1px solid #999;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .tab-button:hover {
      background: #c0c0c0;
    }

    .tab-button.active {
      background: #fff;
      border-color: #333;
      font-weight: bold;
    }

    .tab-close-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      margin-left: 4px;
      color: #666;
    }

    .tab-close-btn:hover {
      color: #000;
    }

    #new-tab-btn {
      padding: 8px 12px;
      background: #e8e8e8;
      border: 1px solid #999;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    #tab-content {
      flex: 1;
      overflow: hidden;
      position: relative;
      background: #fff;
    }

    .tab-pane {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .tab-pane.active {
      display: flex;
    }

    .home-ui {
      flex: 1;
      overflow: auto;
      padding: 20px;
    }

    .search-box {
      margin-bottom: 30px;
    }

    .search-box input {
      width: 100%;
      max-width: 600px;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 24px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
    }

    .shortcuts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .shortcut-card {
      padding: 20px;
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .shortcut-card:hover {
      background: #f0f0f0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .shortcut-card .icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .shortcut-card .label {
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }

    .iframe-pane {
      flex: 1;
      overflow: hidden;
    }

    x-frame-bypass {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Gatekeeper Overlay -->
  <div id="gatekeeper-overlay">
    Gatekeeper Active
  </div>

  <!-- Browser Container -->
  <div id="browser-container">
    <!-- Tab Row -->
    <div id="tab-row">
      <button id="new-tab-btn">+ New Tab</button>
    </div>

    <!-- Tab Content -->
    <div id="tab-content"></div>
  </div>

  <script>
    let unlocked = false;
    let activeTabId = null;
    const tabs = {};
    let tabCounter = 0;

    // ===== GATEKEEPER: Cmd+O or Ctrl+O to unlock =====
    function handleGatekeeper(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'o') {
        e.preventDefault();
        unlocked = true;
        document.getElementById('gatekeeper-overlay').classList.add('hidden');
        document.getElementById('browser-container').classList.add('unlocked');
      }
    }

    document.addEventListener('keydown', handleGatekeeper);

    // ===== REDIRECT LOGIC =====
    // Redirect when page becomes inactive
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && unlocked) {
        window.location.replace('https://typing.goodandbeautiful.com/');
      }
    });

    window.addEventListener('blur', () => {
      if (unlocked) {
        window.location.replace('https://typing.goodandbeautiful.com/');
      }
    });

    // 1-second timer: if gatekeeper not unlocked, redirect
    setTimeout(() => {
      if (!unlocked) {
        window.location.replace('https://typing.goodandbeautiful.com/');
      }
    }, 1000);

    // ===== TAB MANAGEMENT =====
    function createTab(isHome = false) {
      const tabId = `tab-${tabCounter++}`;
      tabs[tabId] = {
        id: tabId,
        title: isHome ? 'Home' : 'New Tab',
        isHome: isHome,
        url: '',
        content: null
      };

      if (!activeTabId) {
        activeTabId = tabId;
      }

      return tabId;
    }

    function updateTabRowUi() {
      const tabRow = document.getElementById('tab-row');
      const tabButtons = tabRow.querySelectorAll('.tab-button');
      tabButtons.forEach(btn => btn.remove());

      Object.values(tabs).forEach(tab => {
        const btn = document.createElement('button');
        btn.className = 'tab-button' + (tab.id === activeTabId ? ' active' : '');
        btn.innerHTML = `
          <span>${tab.title}</span>
          <button class="tab-close-btn">✕</button>
        `;

        btn.addEventListener('click', () => switchActiveTab(tab.id));
        btn.querySelector('.tab-close-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          closeTab(tab.id);
        });

        tabRow.insertBefore(btn, document.getElementById('new-tab-btn'));
      });
    }

    function renderTabContentUi() {
      const container = document.getElementById('tab-content');
      container.innerHTML = '';

      Object.values(tabs).forEach(tab => {
        const pane = document.createElement('div');
        pane.className = 'tab-pane' + (tab.id === activeTabId ? ' active' : '');

        if (tab.isHome) {
          pane.innerHTML = `
            <div class="home-ui">
              <div class="search-box">
                <input type="text" placeholder="Search or enter URL" id="search-input-${tab.id}">
              </div>
              <div class="shortcuts">
                <div class="shortcut-card" data-url="https://www.youtube.com">
                  <div class="icon">▶</div>
                  <div class="label">YouTube</div>
                </div>
                <div class="shortcut-card" data-url="https://mail.google.com">
                  <div class="icon">✉</div>
                  <div class="label">Gmail</div>
                </div>
                <div class="shortcut-card" data-url="https://drive.google.com">
                  <div class="icon">📁</div>
                  <div class="label">Drive</div>
                </div>
                <div class="shortcut-card" data-url="https://maps.google.com">
                  <div class="icon">📍</div>
                  <div class="label">Maps</div>
                </div>
              </div>
            </div>
          `;

          const searchInput = pane.querySelector(`#search-input-${tab.id}`);
          searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
              let url = searchInput.value;
              if (!url.startsWith('http')) {
                url = 'https://' + url;
              }
              navigateTo(tab.id, url);
            }
          });

          pane.querySelectorAll('.shortcut-card').forEach(card => {
            card.addEventListener('click', () => {
              navigateTo(tab.id, card.dataset.url);
            });
          });
        } else {
          pane.className += ' iframe-pane';
          const iframe = document.createElement('x-frame-bypass');
          iframe.src = tab.url;
          pane.appendChild(iframe);
        }

        container.appendChild(pane);
      });
    }

    function switchActiveTab(id) {
      activeTabId = id;
      updateTabRowUi();
      renderTabContentUi();
    }

    function closeTab(id) {
      if (tabs[id].isHome) return; // Can't close home tab
      delete tabs[id];

      if (activeTabId === id) {
        activeTabId = Object.keys(tabs)[0] || null;
      }

      updateTabRowUi();
      renderTabContentUi();
    }

    function navigateTo(tabId, url) {
      tabs[tabId].title = new URL(url).hostname || 'Tab';
      tabs[tabId].url = url;
      tabs[tabId].isHome = false;

      switchActiveTab(tabId);
    }

    document.getElementById('new-tab-btn').addEventListener('click', () => {
      const newTabId = createTab(false);
      switchActiveTab(newTabId);
    });

    // ===== INIT =====
    const homeTabId = createTab(true);
    updateTabRowUi();
    renderTabContentUi();
  </script>
</body>
</html>
