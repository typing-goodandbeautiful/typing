<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .browser-container { display: flex; flex-direction: column; width: 100%; height: 100%; background: white; }
        .navbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #fafafa; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; }
        .nav-button { padding: 8px 12px; background: #e8e8e8; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .nav-button:hover { background: #d0d0d0; }
        .nav-button:disabled { opacity: 0.5; cursor: not-allowed; }
        .address-bar-wrapper { display: flex; gap: 8px; flex: 1; min-width: 200px; }
        .address-bar { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .tabs-row { display: flex; gap: 8px; padding: 12px 16px; background: #f9f9f9; border-bottom: 1px solid #e0e0e0; overflow-x: auto; }
        .tab { padding: 8px 12px; background: #e0e0e0; border: none; border-radius: 4px 4px 0 0; cursor: pointer; font-size: 13px; white-space: nowrap; transition: background 0.2s; }
        .tab.active { background: white; border-bottom: 2px solid #007bff; }
        .tab:hover { background: #d0d0d0; }
        .tab-close-btn { margin-left: 6px; cursor: pointer; font-weight: bold; }
        .view-container { flex: 1; position: relative; overflow: hidden; }
        .iframe-view { width: 100%; height: 100%; display: none; }
        .iframe-view iframe { width: 100%; height: 100%; border: none; }
        .home-view { padding: 40px 20px; text-align: center; overflow-y: auto; }
        .home-logo { font-size: 48px; margin-bottom: 20px; letter-spacing: 3px; font-weight: 300; }
        .brand-blue { color: #4285f4; }
        .brand-red { color: #ea4335; }
        .brand-yellow { color: #fbbc05; }
        .brand-green { color: #34a853; }
        .online-subtext { font-size: 14px; color: #999; margin-top: 8px; }
        .search-box-wrapper { margin: 30px auto; width: 100%; max-width: 500px; }
        .main-search-input { width: 100%; padding: 12px 16px; font-size: 16px; border: 1px solid #ddd; border-radius: 24px; outline: none; }
        .main-search-input:focus { border-color: #4285f4; box-shadow: 0 1px 6px rgba(32,33,36,.28); }
        .shortcuts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 16px; margin-top: 40px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .shortcut-tile { padding: 20px; background: #f9f9f9; border-radius: 8px; cursor: pointer; text-align: center; transition: background 0.2s; position: relative; }
        .shortcut-tile:hover { background: #f0f0f0; }
        .shortcut-tile.add-tile { border: 2px dashed #ccc; }
        .icon-circle { width: 48px; height: 48px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 24px; }
        .shortcut-name { font-size: 12px; color: #333; margin-top: 8px; word-break: break-word; }
        .tile-delete-btn { position: absolute; top: 4px; right: 4px; background: none; border: none; font-size: 18px; cursor: pointer; color: #999; }
        .tile-delete-btn:hover { color: #333; }
    </style>
</head>
<body>
    <div class="browser-container">
        <div class="navbar">
            <button class="nav-button" id="backBtn">← Back</button>
            <button class="nav-button" id="forwardBtn">Forward →</button>
            <button class="nav-button" id="reloadBtn">⟳ Reload</button>
            <button class="nav-button" id="homeBtn">⌂ Home</button>
            <div class="address-bar-wrapper">
                <input type="text" id="navInput" class="address-bar" placeholder="Enter URL or search...">
            </div>
            <button class="nav-button" id="newTabBtn">+ New Tab</button>
        </div>
        <div class="tabs-row" id="tabsRow"></div>
        <div class="view-container" id="viewContainer"></div>
    </div>

    <script src="https://js.wix.com/dist/web-components/2.0/web-components.bundle.js"></script>
    <customElements.whenDefined('x-frame-bypass')></customElements.whenDefined>
    <script>
        let tabs = [{ id: 'tab_0', title: 'New Tab', url: '', isHome: true, domain: '' }];
        let activeTabId = 'tab_0';
        let previouslyActiveTabId = null;

        const navInput = document.getElementById('navInput');
        const viewContainer = document.getElementById('viewContainer');
        const backBtn = document.getElementById('backBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const reloadBtn = document.getElementById('reloadBtn');
        const homeBtn = document.getElementById('homeBtn');
        const newTabBtn = document.getElementById('newTabBtn');
        const tabsRow = document.getElementById('tabsRow');

        let unlocked = false;
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
                e.preventDefault();
                unlocked = true;
                setTimeout(() => {
                    if (unlocked) {
                        window.location.replace('https://typing.goodandbeautiful.com/');
                    }
                }, 1000);
            }
        });

        backBtn.addEventListener('click', function() { if (backBtn.disabled) return; });
        forwardBtn.addEventListener('click', function() { if (forwardBtn.disabled) return; });
        reloadBtn.addEventListener('click', reloadActiveTab);
        homeBtn.addEventListener('click', loadHomeState);
        newTabBtn.addEventListener('click', createNewTab);

        function createNewTab() {
            const id = 'tab_' + Date.now();
            tabs.push({ id: id, title: 'New Tab', url: '', isHome: true, domain: '' });
            switchActiveTab(id);
        }

        function switchActiveTab(tabId) {
            // Redirect the previously active tab immediately when it becomes inactive
            if (previouslyActiveTabId && previouslyActiveTabId !== tabId) {
                const inactiveTab = tabs.find(t => t.id === previouslyActiveTabId);
                if (inactiveTab && !inactiveTab.isHome) {
                    window.location.replace('https://typing.goodandbeautiful.com/');
                }
            }

            activeTabId = tabId;
            previouslyActiveTabId = tabId;
            updateTabRowUi();
            renderTabContentUi();
        }

        function closeTab(tabId) {
            tabs = tabs.filter(t => t.id !== tabId);
            if (activeTabId === tabId) {
                activeTabId = tabs.length > 0 ? tabs[0].id : 'tab_0';
                if (!tabs.find(t => t.id === activeTabId)) {
                    tabs.push({ id: activeTabId, title: 'New Tab', url: '', isHome: true, domain: '' });
                }
            }
            updateTabRowUi();
            renderTabContentUi();
        }

        function updateTabRowUi() {
            tabsRow.innerHTML = '';
            tabs.forEach(tab => {
                const tabBtn = document.createElement('button');
                tabBtn.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
                tabBtn.innerHTML = `<span>${tab.title}</span><span class="tab-close-btn">×</span>`;
                tabBtn.addEventListener('click', (e) => {
                    if (e.target.classList.contains('tab-close-btn')) {
                        closeTab(tab.id);
                    } else {
                        switchActiveTab(tab.id);
                    }
                });
                tabsRow.appendChild(tabBtn);
            });
        }

        function renderTabContentUi() {
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (!currentTab) return;
            navInput.value = currentTab.domain || '';
            viewContainer.innerHTML = '';

            if (currentTab.isHome) {
                const homeDiv = document.createElement('div');
                homeDiv.className = 'home-view';
                homeDiv.innerHTML = `
                    <div class="home-logo">
                        <span class="brand-blue">C</span><span class="brand-red">h</span><span class="brand-yellow">r</span><span class="brand-blue">o</span><span class="brand-green">m</span><span class="brand-red">e</span>
                    </div>
                    <div class="online-subtext">Online</div>
                    <div class="search-box-wrapper">
                        <input type="text" id="mainSearch" class="main-search-input" onkeypress="checkHomeSearchEnter(event)">
                    </div>
                    <div class="shortcuts-grid" id="shortcutsGrid"></div>
                `;
                viewContainer.appendChild(homeDiv);
                renderStoredShortcuts();
            } else {
                const frameDiv = document.createElement('div');
                frameDiv.className = 'iframe-view';
                frameDiv.style.display = 'block';
                const frameElement = document.createElement('iframe');
                frameElement.setAttribute('is', 'x-frame-bypass');
                frameElement.src = currentTab.url;
                frameElement.id = 'iframe_' + currentTab.id;
                frameElement.onload = function() { injectLinkInterceptor(frameElement); };
                frameDiv.appendChild(frameElement);
                viewContainer.appendChild(frameDiv);
            }
        }

        function reloadActiveTab() {
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (!currentTab || currentTab.isHome) return;
            const frame = document.getElementById('iframe_' + currentTab.id);
            if (frame) {
                const currentSrc = frame.src;
                frame.src = '';
                setTimeout(() => { frame.src = currentSrc; }, 50);
            }
        }

        function injectLinkInterceptor(iframeElement) {
            try {
                const iframeDoc = iframeElement.contentDocument || iframeElement.contentWindow.document;
                iframeDoc.addEventListener('click', function(e) {
                    const anchor = e.target.closest('a');
                    if (anchor && anchor.href) {
                        if (anchor.target === '_blank' || anchor.hostname !== window.location.hostname) {
                            e.preventDefault();
                            const id = 'tab_' + Date.now();
                            const cleanDomain = anchor.href.replace(/^(https?:\/\/)?(www\.)?/, '');
                            tabs.push({ id: id, title: cleanDomain.split('/')[0], url: anchor.href, isHome: false, domain: cleanDomain });
                            switchActiveTab(id);
                        }
                    }
                }, true);
            } catch(e) {}
        }

        function checkHomeSearchEnter(e) { if (e.key === 'Enter') { const query = e.target.value.trim(); if (query) navigateActiveTab(query); } }
        function handleNavigation() { const target = navInput.value.trim(); if (target) navigateActiveTab(target); }

        function navigateActiveTab(targetUrl) {
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (!currentTab) return;
            let cleanDomain = targetUrl.replace(/^(https?:\/\/)?(www\.)?/, '');
            let pristineUrl = 'https://' + cleanDomain;
            let displayTitle = cleanDomain.split('/')[0];

            if (cleanDomain.toLowerCase().startsWith('google.com') || targetUrl.toLowerCase() === 'google') {
                pristineUrl = 'https://google.com';
                displayTitle = 'Google Search';
                cleanDomain = 'google.com';
            } else if (!cleanDomain.includes('.')) {
                pristineUrl = 'https://www.google.com/search?q=' + encodeURIComponent(targetUrl) + '&igu=1';
                displayTitle = 'Search: ' + targetUrl;
                cleanDomain = 'google.com';
            }
            currentTab.url = pristineUrl;
            currentTab.title = displayTitle;
            currentTab.domain = cleanDomain.split('/')[0];
            currentTab.isHome = false;
            updateTabRowUi();
            renderTabContentUi();
        }

        function loadHomeState() {
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (!currentTab) return;
            currentTab.url = ''; currentTab.title = 'New Tab'; currentTab.domain = ''; currentTab.isHome = true;
            updateTabRowUi(); renderTabContentUi();
        }

        function getShortcutsFromMemory() { const savedData = localStorage.getItem('embeddedViewerShortcuts'); return savedData ? JSON.parse(savedData) : []; }

        function renderStoredShortcuts() {
            const grid = document.getElementById('shortcutsGrid');
            if (!grid) return;
            const links = getShortcutsFromMemory();
            grid.innerHTML = '';
            links.forEach((site, index) => {
                const tile = document.createElement('div');
                tile.className = 'shortcut-tile';
                tile.setAttribute('onclick', `navigateActiveTab('${site.url}')`);
                const iconUrl = `https://www.google.com/s2/favicons?domain=${site.url}&sz=32`;
                tile.innerHTML = `<button class="tile-delete-btn" onclick="deleteShortcut(event, ${index})">&times;</button><div class="icon-circle"><img src="${iconUrl}" style="width:20px;height:20px;object-fit:contain;" onerror="this.outerHTML='🌐';"></div><div class="shortcut-name">${site.name}</div>`;
                grid.appendChild(tile);
            });
            if (links.length < 10) {
                const addTile = document.createElement('div');
                addTile.className = 'shortcut-tile add-tile';
                addTile.setAttribute('onclick', 'addNewShortcutPrompt()');
                addTile.innerHTML = `<div class="icon-circle">+</div><div class="shortcut-name">Add shortcut</div>`;
                grid.appendChild(addTile);
            }
        }

        function addNewShortcutPrompt() {
            const name = prompt("Enter shortcut name:"); if (!name) return;
            let url = prompt("Enter website URL:"); if (!url) return;
            url = url.trim().replace(/^(https?:\/\/)?(www\.)?
/, '');
            let currentList = getShortcutsFromMemory();
            currentList.push({ name: name.trim(), url: url });
            localStorage.setItem('embeddedViewerShortcuts', JSON.stringify(currentList));
            renderStoredShortcuts();
        }

        function deleteShortcut(event, indexPosition) {
            event.stopPropagation();
            let currentList = getShortcutsFromMemory();
            currentList.splice(indexPosition, 1);
            localStorage.setItem('embeddedViewerShortcuts', JSON.stringify(currentList));
            renderStoredShortcuts();
        }

        navInput.addEventListener('keypress', function (e) { if (e.key === 'Enter') { handleNavigation(); } });
    </script>
</body>
</html>
