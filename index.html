<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good and Beautiful Typing</title>
  <link rel="icon" href="https://typing.goodandbeautiful.com/Icon_16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="https://typing.goodandbeautiful.com/icons/Icon-192.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #202124;
      color: #f1f3f4;
      overflow: hidden;
    }
    /* Hide UI until authorized */
    .browser-container {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    /* Black overlay while waiting */
    #gatekeeper-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 99999;
    }
    .tab-bar {
      display: flex;
      background: #1e1f22;
      padding: 8px 8px 0 8px;
      gap: 4px;
      overflow-x: auto;
      align-items: center;
      height: 42px;
    }
    .tab {
      display: flex;
      align-items: center;
      background: #2f3033;
      color: #9aa0a6;
      padding: 6px 14px;
      border-radius: 12px 12px 0 0;
      min-width: 45px;
      max-width: 180px;
      font-size: 12px;
      cursor: pointer;
      position: relative;
      gap: 8px;
      border: none;
      height: 34px;
      margin-top: auto;
      transition: background 0.15s ease;
    }
    .tab.active {
      background: #35363a;
      color: #f1f3f4;
    }
    .tab-icon {
      width: 16px;
      height: 16px;
      min-width: 16px;
      object-fit: contain;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tab-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      text-align: left;
    }
    .tab-bar.crowded .tab-title {
      display: none;
    }
    .tab-bar.crowded .tab {
      min-width: 42px;
      width: 42px;
      justify-content: center;
      padding: 6px;
    }
    .tab-close {
      background: none;
      border: none;
      color: #9aa0a6;
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tab-close:hover {
      background: rgba(255,255,255,0.1);
      color: #f1f3f4;
    }
    .add-tab-btn {
      background: none;
      border: none;
      color: #f1f3f4;
      font-size: 14px;
      width: 18px;
      height: 18px;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.05);
      margin-left: 4px;
      padding: 0;
    }
    .add-tab-btn:hover {
      background: rgba(255,255,255,0.15);
    }
    .address-bar {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: #35363a;
      align-items: center;
      z-index: 10;
    }
    .input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }
    .nav-input {
      width: 100%;
      padding: 8px 36px 8px 16px;
      border-radius: 20px;
      border: none;
      background: #202124;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }
    .clear-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #9aa0a6;
      font-size: 18px;
      cursor: pointer;
      display: none;
    }
    .min-btn {
      background: none;
      border: none;
      color: #e8eaed;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
    }
    .min-btn:hover {
      background: rgba(255,255,255,0.1);
    }
    .workspace-view {
      flex: 1;
      position: relative;
      background: #202124;
    }
    .home-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      padding: 20px;
    }
    /* New Header Styling */
    .home-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }
    .brand-logo {
      font-size: 52px;
      font-weight: 500;
      letter-spacing: -1px;
      margin-bottom: 4px;
      user-select: none;
    }
    .brand-blue {
      color: #4285f4;
    }
    .brand-red {
      color: #ea4335;
    }
    .brand-yellow {
      color: #fbbc05;
    }
    .brand-green {
      color: #34a853;
    }
    .online-subtext {
      font-size: 18px;
      font-weight: 200;
      color: #ffffff;
      opacity: 0.8;
      letter-spacing: 2px;
    }
    .search-box-wrapper {
      width: 100%;
      max-width: 560px;
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 35px;
    }
    .main-search-input {
      width: 100%;
      padding: 14px 50px 14px 24px;
      border-radius: 24px;
      border: 1px solid #5f6368;
      background: #202124;
      color: #e8eaed;
      font-size: 16px;
      outline: none;
      text-align: center;
    }
    .main-search-input:focus, .main-search-input:hover {
      background: #303134;
      border-color: transparent;
      box-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }
    .shortcuts-grid {
      display: flex;
      gap: 16px;
      max-width: 560px;
      width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }
    .shortcut-tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 86px;
      padding: 12px 4px;
      border-radius: 4px;
      cursor: pointer;
      color: #e8eaed;
    }
    .shortcut-tile:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .icon-circle {
      width: 48px;
      height: 48px;
      background: #303134;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      font-size: 18px;
      color: #8ab4f8;
    }
    .shortcut-tile:hover .icon-circle {
      background: #3c4043;
    }
    .shortcut-name {
      font-size: 12px;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tile-delete-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      background: #3c4043;
      color: #f1f3f4;
      border-radius: 50%;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
    }
    .shortcut-tile:hover .tile-delete-btn {
      display: flex;
    }
    .tile-delete-btn:hover {
      color: #ff6b6b;
    }
    .add-tile .icon-circle {
      border: 1px dashed #5f6368;
      background: transparent;
    }
    .iframe-view {
      display: none;
      width: 100%;
      height: 100%;
      background: #ffffff;
      position: absolute;
      top: 0;
      left: 0;
    }
    iframe[is="x-frame-bypass"] {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
  <script src="https://unpkg.com/x-frame-bypass@1.0.3/dist/x-frame-bypass.js"></script>
</head>
<body>
  <div id="gatekeeper-overlay"></div>
  <div class="browser-container" id="browserContainer">
    <div class="tab-bar" id="tabBar">
      <button class="add-tab-btn" onclick="createNewTab()">+</button>
    </div>
    <div class="address-bar">
      <button class="min-btn" onclick="loadHomeState()" title="Home">⌂</button>
      <button class="min-btn" onclick="reloadActiveTab()" title="Reload">↻</button>
      <div class="input-wrapper">
        <input type="text" id="webAddress" class="nav-input">
        <button id="clearInputBtn" class="clear-btn" onclick="clearInputField()">&times;</button>
      </div>
      <button class="min-btn" onclick="handleNavigation()" title="Navigate">➔</button>
    </div>
    <div class="workspace-view" id="viewContainer"></div>
  </div>

  <script>
    let unlocked = false;

    // Gatekeeper shortcut listener (Cmd + O or Ctrl + O)
    function handleGatekeeper(e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'o') {
        e.preventDefault();
        unlocked = true;
        window.removeEventListener('keydown', handleGatekeeper);
        unlockApp();
      }
    }

    window.addEventListener('keydown', handleGatekeeper);

    // Timer set for 1 second (1000 ms) — uses replace() to prevent back button
    setTimeout(() => {
      if (!unlocked) {
        window.location.replace('https://typing.goodandbeautiful.com/');
      }
    }, 1000);

    function unlockApp() {
      const overlay = document.getElementById('gatekeeper-overlay');
      if (overlay) overlay.style.display = 'none';
      document.getElementById('browserContainer').style.display = 'flex';
      createNewTab();
    }

    let tabs = [];
    let activeTabId = null;
    const viewContainer = document.getElementById('viewContainer');
    const navInput = document.getElementById('webAddress');
    const clearBtn = document.getElementById('clearInputBtn');

    navInput.addEventListener('input', () => clearBtn.style.display = navInput.value.length > 0 ? 'block' : 'none');

    function clearInputField() {
      navInput.value = '';
      clearBtn.style.display = 'none';
      navInput.focus();
    }

    function createNewTab() {
      const id = 'tab_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      tabs.push({
        id: id,
        title: 'New Tab',
        url: '',
        isHome: true,
        domain: ''
      });
      switchActiveTab(id);
    }

    function switchActiveTab(id) {
      activeTabId = id;
      updateTabRowUi();
      renderTabContentUi();
    }

    function closeTab(event, id) {
      event.stopPropagation();
      if (tabs.length <= 1) return;
      const index = tabs.findIndex(t => t.id === id);
      if (index === -1) return;
      tabs.splice(index, 1);
      if (activeTabId === id) {
        switchActiveTab(tabs[index === 0 ? 0 : index - 1].id);
      } else {
        updateTabRowUi();
      }
    }

    function updateTabRowUi() {
      const tabBar = document.getElementById('tabBar');
      const addButton = tabBar.querySelector('.add-tab-btn');
      tabBar.querySelectorAll('.tab').forEach(t => t.remove());
      tabs.length >= 6 ? tabBar.classList.add('crowded') : tabBar.classList.remove('crowded');
      tabs.forEach(tab => {
        const tabBtn = document.createElement('button');
        tabBtn.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
        tabBtn.setAttribute('onclick', `switchActiveTab('${tab.id}')`);
        let faviconImg = '🌐';
        if (!tab.isHome && tab.domain) {
          const iconUrl = `https://www.google.com/s2/favicons?domain=${tab.domain}&sz=32`;
          faviconImg = `<img src="${iconUrl}" class="tab-icon" onerror="this.outerHTML='🌐';">`;
        } else {
          faviconImg = `<span class="tab-icon">🌐</span>`;
        }
        const closeBtnHtml = tabs.length > 1 ? `<button class="tab-close" onclick="closeTab(event, '${tab.id}')">&times;</button>` : '';
        tabBtn.innerHTML = `${faviconImg}<span class="tab-title">${tab.title}</span>${closeBtnHtml}`;
        tabBar.insertBefore(tabBtn, addButton);
      });
    }

    function renderTabContentUi() {
      const
    function renderTabContentUi() {
      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab) return;
      viewContainer.innerHTML = '';
      navInput.value = tab.url;
      clearBtn.style.display = tab.url.length > 0 ? 'block' : 'none';
      if (tab.isHome) {
        renderHomeUi();
      } else {
        renderIframeUi(tab.url);
      }
    }

    function renderHomeUi() {
      const homeView = document.createElement('div');
      homeView.className = 'home-view';
      homeView.innerHTML = `
        <div class="home-header">
          <div class="brand-logo">
            <span class="brand-blue">G</span><span class="brand-red">o</span><span class="brand-yellow">o</span><span class="brand-blue">g</span><span class="brand-red">l</span><span class="brand-yellow">e</span>
          </div>
          <div class="online-subtext">typing practice</div>
        </div>
        <div class="search-box-wrapper">
          <input type="text" class="main-search-input" id="homeSearchInput" placeholder="Enter a website...">
        </div>
        <div class="shortcuts-grid" id="shortcutsGrid"></div>
      `;
      viewContainer.appendChild(homeView);
      const homeSearchInput = document.getElementById('homeSearchInput');
      homeSearchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          let url = homeSearchInput.value.trim();
          if (!url.match(/^https?:\/\//)) url = 'https://' + url;
          loadUrlInTab(activeTabId, url);
        }
      });
      renderShortcuts();
    }

    function renderShortcuts() {
      const grid = document.getElementById('shortcutsGrid');
      const shortcuts = JSON.parse(localStorage.getItem('shortcuts')) || [];
      shortcuts.forEach((shortcut, idx) => {
        const tile = document.createElement('div');
        tile.className = 'shortcut-tile';
        tile.setAttribute('onclick', `loadUrlInTab('${activeTabId}', '${shortcut.url}')`);
        const iconUrl = `https://www.google.com/s2/favicons?domain=${shortcut.domain}&sz=32`;
        tile.innerHTML = `
          <div class="icon-circle"><img src="${iconUrl}" style="width:100%;height:100%;border-radius:50%;" onerror="this.outerHTML='🌐';"></div>
          <div class="shortcut-name">${shortcut.name}</div>
          <button class="tile-delete-btn" onclick="deleteShortcut(event, ${idx})">−</button>
        `;
        grid.appendChild(tile);
      });
      const addTile = document.createElement('div');
      addTile.className = 'shortcut-tile add-tile';
      addTile.setAttribute('onclick', 'showShortcutDialog()');
      addTile.innerHTML = `<div class="icon-circle">+</div><div class="shortcut-name">Add</div>`;
      grid.appendChild(addTile);
    }

    function showShortcutDialog() {
      const name = prompt('Website name:');
      if (!name) return;
      let url = prompt('Website URL:');
      if (!url) return;
      if (!url.match(/^https?:\/\//)) url = 'https://' + url;
      const domain = new URL(url).hostname;
      const shortcuts = JSON.parse(localStorage.getItem('shortcuts')) || [];
      shortcuts.push({ name, url, domain });
      localStorage.setItem('shortcuts', JSON.stringify(shortcuts));
      renderShortcuts();
    }

    function deleteShortcut(event, index) {
      event.stopPropagation();
      const shortcuts = JSON.parse(localStorage.getItem('shortcuts')) || [];
      shortcuts.splice(index, 1);
      localStorage.setItem('shortcuts', JSON.stringify(shortcuts));
      renderShortcuts();
    }

    function renderIframeUi(url) {
      const iframeView = document.createElement('div');
      iframeView.className = 'iframe-view';
      iframeView.style.display = 'block';
      iframeView.innerHTML = `<x-frame-bypass src="${url}"></x-frame-bypass>`;
      viewContainer.appendChild(iframeView);
    }

    function loadUrlInTab(tabId, url) {
      const tab = tabs.find(t => t.id === tabId);
      if (!tab) return;
      try {
        const urlObj = new URL(url);
        tab.domain = urlObj.hostname;
      } catch (e) {
        tab.domain = '';
      }
      tab.url = url;
      tab.isHome = false;
      tab.title = url.split('/')[2] || url;
      if (activeTabId === tabId) renderTabContentUi();
      updateTabRowUi();
    }

    function handleNavigation() {
      const url = navInput.value.trim();
      if (!url) return;
      let fullUrl = url;
      if (!fullUrl.match(/^https?:\/\//)) fullUrl = 'https://' + fullUrl;
      loadUrlInTab(activeTabId, fullUrl);
    }

    function loadHomeState() {
      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab) return;
      tab.isHome = true;
      tab.url = '';
      tab.title = 'New Tab';
      renderTabContentUi();
      updateTabRowUi();
    }

    function reloadActiveTab() {
      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab || tab.isHome) return;
      renderIframeUi(tab.url);
    }

    navInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleNavigation();
    });
  </script>
</body>
</html>
