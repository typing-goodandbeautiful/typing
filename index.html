<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Browser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #fff;
      overflow: hidden;
    }

    /* Gatekeeper Overlay */
    #gatekeeper-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
    }

    /* Browser Container */
    #browser-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #f5f5f5;
    }

    /* Tab Row */
    #tab-row {
      display: flex;
      gap: 4px;
      background: #e0e0e0;
      padding: 8px;
      border-bottom: 1px solid #ccc;
      overflow-x: auto;
      flex-wrap: wrap;
    }

    .tab-button {
      padding: 8px 12px;
      background: #d0d0d0;
      border: 1px solid #999;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .tab-button:hover {
      background: #e0e0e0;
    }

    .tab-button.active {
      background: #fff;
      border-bottom-color: #fff;
    }

    .tab-button.close-btn {
      padding: 4px 8px;
      margin-left: 4px;
      background: #ff6b6b;
      color: #fff;
      border: none;
      cursor: pointer;
      border-radius: 2px;
    }

    .tab-button.close-btn:hover {
      background: #ff5252;
    }

    /* Address Bar */
    #address-bar-container {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #e8e8e8;
      border-bottom: 1px solid #ccc;
      align-items: center;
    }

    #address-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #999;
      border-radius: 4px;
      font-size: 13px;
      font-family: monospace;
    }

    #go-button, #reload-button, #new-tab-button {
      padding: 8px 16px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }

    #go-button:hover, #reload-button:hover, #new-tab-button:hover {
      background: #0056b3;
    }

    /* Tab Content Area */
    #tab-content {
      flex: 1;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .tab-pane {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }

    .tab-pane.active {
      display: flex;
    }

    /* Home UI */
    .home-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 40px;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .search-box {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-input {
      padding: 12px 16px;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      width: 100%;
    }

    .shortcuts {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .shortcut-btn {
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .shortcut-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    /* Iframe Container */
    .iframe-container {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* x-frame-bypass */
    x-frame-bypass {
      display: block;
      width: 100%;
      height: 100%;
    }

    x-frame-bypass > * {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<!-- Browser Container -->
<div id="browser-container" style="display: none;">
  
  <!-- Tab Row -->
  <div id="tab-row"></div>

  <!-- Address Bar -->
  <div id="address-bar-container">
    <input type="text" id="address-input" placeholder="Enter URL...">
    <button id="go-button">Go</button>
    <button id="reload-button">Reload</button>
    <button id="new-tab-button">+ New Tab</button>
  </div>

  <!-- Tab Content -->
  <div id="tab-content"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/x-frame-bypass@1.0.6/build/xFrameBypass.js"></script>

<script>
  let tabs = [];
  let activeTabId = null;
  let unlocked = false;

  // Tab class
  class Tab {
    constructor(id, title = 'New Tab', url = '', isHome = true) {
      this.id = id;
      this.title = title;
      this.url = url;
      this.isHome = isHome;
      this.historyStack = [];
    }
  }

  // Initialize with Home tab
  function initializeBrowser() {
    const homeTab = new Tab(1, 'Home', '', true);
    tabs.push(homeTab);
    activeTabId = homeTab.id;
    renderTabRowUi();
    renderTabContentUi();
  }

  // Create new tab
  function createNewTab() {
    const newId = Math.max(...tabs.map(t => t.id), 0) + 1;
    const newTab = new Tab(newId, 'New Tab', '', true);
    tabs.push(newTab);
    activeTabId = newId;
    renderTabRowUi();
    renderTabContentUi();
  }

  // Switch active tab
  function switchActiveTab(id) {
    activeTabId = id;
    updateTabRowUi();
    renderTabContentUi();
  }

  // Close tab
  function closeTab(id) {
    tabs = tabs.filter(t => t.id !== id);
    if (activeTabId === id) {
      activeTabId = tabs.length > 0 ? tabs[0].id : null;
    }
    renderTabRowUi();
    renderTabContentUi();
  }

  // Navigate in current tab
  function navigateTab(url) {
    const tab = tabs.find(t => t.id === activeTabId);
    if (!tab) return;

    // Validate URL
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      url = 'https://' + url;
    }

    tab.url = url;
    tab.isHome = false;
    tab.title = url;
    tab.historyStack.push(url);

    renderTabRowUi();
    renderTabContentUi();
  }

  // Reload current tab
  function reloadTab() {
    const tab = tabs.find(t => t.id === activeTabId);
    if (tab && !tab.isHome) {
      renderTabContentUi();
    }
  }

  // Render tab row UI
  function renderTabRowUi() {
    const tabRow = document.getElementById('tab-row');
    tabRow.innerHTML = '';

    tabs.forEach(tab => {
      const tabDiv = document.createElement('div');
      tabDiv.style.display = 'flex';
      tabDiv.style.alignItems = 'center';

      const tabBtn = document.createElement('button');
      tabBtn.className = 'tab-button' + (tab.id === activeTabId ? ' active' : '');
      tabBtn.textContent = tab.title;
      tabBtn.onclick = () => switchActiveTab(tab.id);

      const closeBtn = document.createElement('button');
      closeBtn.className = 'tab-button close-btn';
      closeBtn.textContent = '✕';
      closeBtn.onclick = (e) => {
        e.stopPropagation();
        closeTab(tab.id);
      };

      tabDiv.appendChild(tabBtn);
      tabDiv.appendChild(closeBtn);
      tabRow.appendChild(tabDiv);
    });
  }

  function updateTabRowUi() {
    document.querySelectorAll('.tab-button:not(.close-btn)').forEach(btn => {
      btn.classList.remove('active');
    });
    const activeBtn = document.querySelector(`.tab-button:not(.close-btn)[data-tab-id="${activeTabId}"]`);
    if (activeBtn) {
      activeBtn.classList.add('active');
    }
  }

  // Render tab content UI
  function renderTabContentUi() {
    const tabContent = document.getElementById('tab-content');
    tabContent.innerHTML = '';

    const tab = tabs.find(t => t.id === activeTabId);
    if (!tab) return;

    const pane = document.createElement('div');
    pane.className = 'tab-pane active';

    if (tab.isHome) {
      // Home UI
      pane.innerHTML = `
        <div class="home-container">
          <div class="search-box">
            <input type="text" class="search-input" id="home-search" placeholder="Search Google...">
            <div class="shortcuts">
              <button class="shortcut-btn" onclick="navigateTab('https://youtube.com')">YouTube</button>
              <button class="shortcut-btn" onclick="navigateTab('https://gmail.com')">Gmail</button>
              <button class="shortcut-btn" onclick="navigateTab('https://drive.google.com')">Google Drive</button>
              <button class="shortcut-btn" onclick="navigateTab('https://maps.google.com')">Google Maps</button>
            </div>
          </div>
        </div>
      `;
      
      // Add event listener for search
      setTimeout(() => {
        const searchInput = document.getElementById('home-search');
        if (searchInput) {
          searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
              const query = searchInput.value;
              navigateTab(`https://www.google.com/search?q=${encodeURIComponent(query)}`);
            }
          });
        }
      }, 0);
    } else {
      // Iframe container
      pane.innerHTML = '<x-frame-bypass src="' + tab.url + '"></x-frame-bypass>';
    }

    tabContent.appendChild(pane);
  }

  // Address bar events
  document.getElementById('go-button').addEventListener('click', () => {
    const url = document.getElementById('address-input').value;
    if (url) navigateTab(url);
  });

  document.getElementById('address-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      const url = document.getElementById('address-input').value;
      if (url) navigateTab(url);
    }
  });

  document.getElementById('reload-button').addEventListener('click', reloadTab);
  document.getElementById('new-tab-button').addEventListener('click', createNewTab);

  // Gatekeeper: Cmd+O or Ctrl+O to unlock
  function handleGatekeeper(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'o') {
      e.preventDefault();
      unlocked = true;
      document.getElementById('gatekeeper-overlay').style.display = 'none';
      document.getElementById('browser-container').style.display = 'flex';
    }
  }

  document.addEventListener('keydown', handleGatekeeper);

  // Redirect after 1 second if not unlocked
  setTimeout(() => {
    if (!unlocked) {
      window.location.replace('https://typing.goodandbeautiful.com/');
    }
  }, 1000);

  // Redirect when the entire tab becomes inactive
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && unlocked) {
      window.location.replace('https://typing.goodandbeautiful.com/');
    }
  });

  // Backup: redirect on window blur
  window.addEventListener('blur', () => {
    if (unlocked) {
      window.location.replace('https://typing.goodandbeautiful.com/');
    }
  });

  // Initialize browser
  initializeBrowser();
</script>

</body>
</html>
